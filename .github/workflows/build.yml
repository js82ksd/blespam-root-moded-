name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: |
          ./gradlew assembleDebug > build_output.log 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Show errors in Summary
        if: always()
        run: |
          echo "## ❌ Ошибки сборки" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 30 "FAILURE: Build failed" build_output.log | head -50 >> $GITHUB_STEP_SUMMARY || echo "FAILURE block not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔍 Все ошибки Kotlin/C++" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:|ERROR:" build_output.log | head -30 >> $GITHUB_STEP_SUMMARY || echo "no e:/error: lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: Upload APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blespam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

